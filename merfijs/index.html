/* Personal text: {name}, {company}, {informal|formal}. Missing values are removed cleanly. */
function PZ(s){
  if(s==null)return '';
  let r=String(s).replace(/\{([^{}|]*)\|([^{}]*)\}/g,(m,a,b)=>S.rcp.f?b:a);
  const E='\u0000';
  r=r.replace(/\{name\}/gi,(S.rcp.n||'').trim()||E).replace(/\{company\}/gi,(S.rcp.c||'').trim()||E).replace(/\{pet\}/gi,(S.rcp.p||'').trim()||E); /* v2.9.34 {pet} = the pet's name (Excel column pet_name) */
  if(r.includes(E)){
    r=r.split('\n').map(line=>{
      if(!line.includes(E))return line;
      const lead=line.trim().startsWith(E);
      let x=line.replace(new RegExp('\\s*'+E+'\\s*,?','g'),' ').replace(/\s+([,.!?])/g,'$1').replace(/,+\s*([.!?]|$)/g,'$1').replace(/ {2,}/g,' ').trim();
      if(lead&&x)x=x.charAt(0).toLocaleUpperCase()+x.slice(1);
      return x;
    }).join('\n');
  }
  /* any other {text} is shown without braces; always NFC so Baltic letters are never split into letter + mark */
  return r.replace(/\{([^{}|]*)\}/g,'$1').normalize('NFC');
}

function applyFx(c,src,fx){
  const rate={normal:1,higher:1.15,cat:1.32,deeper:0.84,robot:1}[fx]||1;
  if(src.playbackRate)src.playbackRate.value=rate;
  let out=src,extra=[];
  if(fx==='higher'){const f=c.createBiquadFilter();f.type='highshelf';f.frequency.value=3000;f.gain.value=4;src.connect(f);out=f;}
  if(fx==='cat'){const f=c.createBiquadFilter();f.type='highpass';f.frequency.value=380;src.connect(f);out=f;}
  if(fx==='deeper'){const f=c.createBiquadFilter();f.type='lowshelf';f.frequency.value=250;f.gain.value=5;src.connect(f);out=f;}
  if(fx==='robot'){const g=c.createGain();g.gain.value=0;const o=c.createOscillator();o.frequency.value=45;o.connect(g.gain);src.connect(g);o.start();out=g;extra.push(o);}
  return {out,extra,rate};
}

function wrap(text,maxW){
  const out=[];
  for(const para of String(text).split('\n')){
    let cur='';
    const seg=needsSeg(S.lang)&&typeof Intl!=='undefined'&&Intl.Segmenter;
    const words=seg?[...new Intl.Segmenter(S.lang,{granularity:'word'}).segment(para)].map(x=>x.segment):para.split(' ');
    for(const w of words){
      const test=seg?cur+w:(cur?cur+' '+w:w);
      if(ctx.measureText(test).width>maxW&&cur){out.push(seg?cur.trimEnd():cur);cur=seg?w.trimStart():w;}else cur=test;
    }
    out.push(cur);
    if(seg)for(let i=1;i<out.length;i++){while(out[i]&&/^[。、，．！？）」』】〉》：；…ー]/.test(out[i])){out[i-1]+=out[i][0];out[i]=out[i].slice(1);}}
